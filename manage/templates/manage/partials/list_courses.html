{% if items %}
    <table class="list-table">
        <thead>
            <tr>
                <th>Code</th>
                <th>Title</th>
                <th>Category</th>
                <th class="num">CP</th>
                <th>Active</th>
                <th class="actions" aria-label="Actions"></th>
            </tr>
        </thead>
        <tbody>
            {% for course in items %}
                <tr>
                    <td>{{ course.code }}</td>
                    <td>{{ course.title }}</td>
                    <td>{{ course.category.name }}</td>
                    <td class="num">{{ course.credit_points|floatformat:"-2" }}</td>
                    <td>{% if course.active %}Yes{% else %}No{% endif %}</td>
                    <td class="actions">
                        <button type="button" class="btn btn--link"
                                hx-get="{% url 'manage:course_edit' course.pk %}"
                                hx-target="#modal" hx-swap="innerHTML"
                                aria-label="Edit {{ course.code }}">Edit</button>
                        <button type="button" class="btn btn--link btn--danger-link"
                                hx-get="{% url 'manage:course_delete' course.pk %}"
                                hx-target="#modal" hx-swap="innerHTML"
                                aria-label="Delete {{ course.code }}">Delete</button>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p class="box__placeholder">No courses yet.</p>
{% endif %}
