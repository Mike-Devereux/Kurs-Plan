{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kurs-Plan{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'planner/checker.css' %}">
    <script src="{% static 'planner/checker.js' %}" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="topbar">
        <a class="topbar__brand" href="{% url 'planner:checker' %}">Kurs-Plan</a>
    </header>
    <main id="main" class="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
