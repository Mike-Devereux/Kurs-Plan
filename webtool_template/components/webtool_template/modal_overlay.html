{# Modal shell extracted from Chem-E supervisor tree content browser.
   Variables: modal_id, modal_title, modal_body (HTML safe) #}

    <div class="webtool-modal-panel">
        {% if modal_title %}<h3>{{ modal_title }}</h3>{% endif %}
        {{ modal_body|safe }}
    </div>
</div>
