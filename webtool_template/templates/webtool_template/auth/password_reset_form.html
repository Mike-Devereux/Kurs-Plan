{% extends "webtool_template/base_auth.html" %}

{% block title %}Password reset{% endblock %}

{% block content %}
    <h1>Reset password</h1>
    <p>Enter your account email address to receive a password reset link.</p>
    <form class="webtool-auth-form webtool-auth-form--simple" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
    </form>
    <p><a href="{{ login_url|default:'/login/' }}">Back to login</a></p>
{% endblock %}
