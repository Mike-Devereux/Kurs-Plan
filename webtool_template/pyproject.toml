[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webtool-template"
version = "0.1.0"
description = "Reusable Django web-tool UI shell extracted from Chem-E"
readme = "TEMPLATE_EXPORT.md"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webtool_template = ["py.typed"]
